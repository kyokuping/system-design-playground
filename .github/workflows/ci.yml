name: CI

on:
  push:
    paths:
      - "tiny_*/**/*.go"
      - "tiny_*/go.mod"
      - "tiny_*/go.sum"
      - "!tiny_*/bench/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-modules:
    name: Discover Go modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find changed tiny projects
        id: modules
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          modules="$(.github/scripts/detect-modules.sh \
            "$BEFORE_SHA" "$GITHUB_SHA" "origin/$DEFAULT_BRANCH")"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  format:
    name: Format (${{ matrix.module }})
    needs: discover-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false

      - name: Check gofmt
        shell: bash
        run: |
          mapfile -d '' go_files < <(git ls-files -z '*.go' ':(exclude)bench/**')

          if (( ${#go_files[@]} == 0 )); then
            echo "No Go files found; skipping gofmt"
            exit 0
          fi

          unformatted="$(gofmt -l "${go_files[@]}")"

          if [[ -n "$unformatted" ]]; then
            echo "The following files need gofmt:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  test:
    name: Test (${{ matrix.module }})
    needs: discover-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-modules.outputs.modules) }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Run tests
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Show coverage
        if: always()
        run: |
          if [[ -f coverage.out ]]; then
            go tool cover -func=coverage.out
          fi

  lint:
    name: Lint (${{ matrix.module }})
    needs: discover-modules
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          working-directory: ${{ matrix.module }}
