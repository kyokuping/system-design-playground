pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    - name: unit tests
      run: ./scripts/for-each-tiny-project.sh go test -short ./...

pre-push:
  parallel: true
  jobs:
    - name: race tests
      run: ./scripts/for-each-tiny-project.sh go test -race -shuffle=on ./...

    - name: lint
      run: ./scripts/for-each-tiny-project.sh golangci-lint run ./...
